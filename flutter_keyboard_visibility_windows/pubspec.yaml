name: flutter_keyboard_visibility_windows
description: An implementation for the Windows platform of `flutter_keyboard_visibility'
version: 2.0.0
homepage: https://github.com/MisterJimson/flutter_keyboard_visibility
repository: https://github.com/MisterJimson/flutter_keyboard_visibility

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

resolution: workspace

flutter:
  plugin:
    implements: flutter_keyboard_visibility
    platforms:
      windows:
        dartPluginClass: FlutterKeyboardVisibilityPluginWindows

dependencies:
  flutter_keyboard_visibility_platform_interface: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
